<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator | CodeAlpha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calc">
  <div class="brand">CODEALPHA · CALCULATOR</div>
  <div class="display">
    <div class="prev" id="prevLine">&nbsp;</div>
    <div class="current" id="currentLine">0</div>
  </div>
  <div class="keys">
    <button class="clear" data-action="clear">AC</button>
    <button class="del" data-action="delete">DEL</button>
    <button class="op" data-op="%">%</button>
    <button class="op" data-op="/">&divide;</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">&times;</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">&minus;</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="span2" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
